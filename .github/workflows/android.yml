name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      # אייקון מהלוגו, אם הועלה לקובץ assets/icon-only.png
      - name: Generate icons
        if: ${{ hashFiles('assets/icon-only.png') != '' }}
        continue-on-error: true
        run: |
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff'
      - run: npm run cap:sync
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      # חתימה קבועה, כדי שאפשר יהיה לעדכן את האפליקציה מעל גרסה קודמת
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk afikey-daat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: afikey-daat-apk
          path: afikey-daat.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${{ github.run_number }}" afikey-daat.apk --title "אפיקי דעת v1.0.${{ github.run_number }}" --notes "גרסה ראשונה"
